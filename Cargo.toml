[package]
name = "willow-extractor"
version = "0.1.0"
edition = "2021"
description = "Bibliographic metadata extraction"
license = "AGPL-3.0"

[lib]
name = "willow_extractor"
path = "src/lib.rs"

[[bin]]
name = "willow-extractor"
path = "src/main.rs"

[dependencies]
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
regex = "1"
thiserror = "2"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["full"] }
urlencoding = "2"
lopdf = "0.34"
